name: Refresh Aurora Live Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - ".github/workflows/refresh-registry.yml"

permissions:
  contents: write

concurrency:
  group: aurora-live-data-refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run registry regression tests
        run: python -m unittest discover -s automation -p 'test_*.py'

      - name: Refresh official source observations
        run: python automation/collector.py

      - name: Publish registry atomically
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "aurora-live-data-bot"
          git config user.email "actions@users.noreply.github.com"

          for attempt in 1 2 3; do
            git fetch origin main

            # If configuration changed while collection was running, discard only
            # this runner's generated working tree and regenerate from latest main.
            if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
              echo "Remote configuration changed; regenerating from latest main (attempt $attempt)."
              git reset --hard origin/main
              python -m unittest discover -s automation -p 'test_*.py'
              python automation/collector.py
            fi

            if git diff --quiet -- registry/; then
              echo "No registry changes."
              exit 0
            fi

            git add registry/
            git commit -m "chore: refresh Aurora live data"

            if git push origin HEAD:main; then
              echo "Registry published."
              exit 0
            fi

            echo "Push raced with another commit; retrying from latest main."
            git fetch origin main
            git reset --hard origin/main
          done

          echo "Unable to publish registry after 3 attempts."
          exit 1
