name: Refresh Aurora Live Data

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */12 * * *"
  push:
    branches:
      - main
    paths:
      - "automation/**"
      - ".github/workflows/refresh-registry.yml"

permissions:
  contents: write

concurrency:
  group: aurora-live-data-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh official source observations
        run: python automation/collector.py

      - name: Commit registry changes
        run: |
          if git diff --quiet -- registry/; then
            echo "No registry changes."
            exit 0
          fi

          git config user.name "aurora-live-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add registry/
          git commit -m "chore: refresh Aurora live data"
          git push
